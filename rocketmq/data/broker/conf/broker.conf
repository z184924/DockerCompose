# 与 apache/rocketmq 镜像内置的默认 broker.conf 一致
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 若客户端从宿主机/其他机器访问，取消注释并改为宿主机 IP，
# 否则 broker 注册到 namesrv 的是容器内 IP，外部连不上：
# brokerIP1 = 192.168.x.x
