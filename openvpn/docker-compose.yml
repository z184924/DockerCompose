version: '3.1'
services:
  openvpn-server:
    image: kylemanna/openvpn
    container_name: openvpn-server
    restart: always
    cap_add:
      - NET_ADMIN
    ports:
      - "1194:1194/udp"
    volumes:
      - ./data:/etc/openvpn
    networks:
      - public

networks:
  public:
    external: true
